    attributes:
      value: |
        Reviso las incidencias cuando puedo; es un proyecto personal y sin ánimo de lucro. Mira antes el [manual](https://github.com/Alexis-VsCode/mario-kart-64-ps2/blob/main/docs/manual/README.md), porque quizá ya lo explico allí.
