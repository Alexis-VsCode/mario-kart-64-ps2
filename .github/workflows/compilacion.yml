# Compila el port y corre las pruebas en cada push y pull request.
name: compilacion

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: "Referencia para comparar el binario (vacío: no se compara)"
        required: false
        default: ""
      publicar:
        description: "sí: regenera build/ y compilaciones/ y los commitea en la rama"
        required: false
        default: "no"
      release:
        description: "Etiqueta de la Release (vacío: no se publica); las notas salen de docs/versiones/<etiqueta>.md"
        required: false
        default: ""
      limpiar_ramas:
        description: "sí: borra las ramas remotas que ya están contenidas en main"
        required: false
        default: "no"

jobs:
  pruebas-pc:
    name: Pruebas en el PC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make test
        run: make test

  compilar-ps2:
    name: Compilar para PS2
    runs-on: ubuntu-latest
    # Imagen oficial de ps2dev fijada por digest (amd64) para que el build sea reproducible
    container: ps2dev/ps2dev@sha256:7327334ab94e273b1723761fcd4a3591a31b78bbc28e4c281ad0fa42b3c8264d
    steps:
      - name: Dependencias del PC
        run: apk add --no-cache bash build-base python3 git coreutils findutils cdrkit
      - uses: actions/checkout@v4
      # build/ está versionado: sin esto make podría reutilizar objetos del repo
      - name: make clean
        run: make clean
      - name: make (release)
        run: . herramientas/entorno.sh && make -j"$(nproc)"
      - name: make DEBUG=1
        run: . herramientas/entorno.sh && make DEBUG=1 -j"$(nproc)"
      # Los guiones de prueba y los registros DEV solo compilan con DEV=1
      - name: make DEV=1
        run: . herramientas/entorno.sh && make DEV=1 -j"$(nproc)"
      - name: make test
        run: make test
      - name: make iso
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE" && . herramientas/entorno.sh && make iso
      - name: Guardar los binarios
        uses: actions/upload-artifact@v4
        with:
          name: smk64-ps2
          path: |
            build/ps2/SLUS_999.99
            build/ps2/SMK64ROM.BIN
            build/ps2/smk64.map
            build/ps2/debug/SLUS_999.99
            compilaciones/*.iso

  mismo-binario:
    name: Comparar el binario con la base
    if: github.event_name == 'workflow_dispatch' && inputs.base != ''
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev@sha256:7327334ab94e273b1723761fcd4a3591a31b78bbc28e4c281ad0fa42b3c8264d
    steps:
      - name: Dependencias del PC
        run: apk add --no-cache bash build-base python3 git coreutils findutils
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE" && . herramientas/entorno.sh && sh herramientas/comparar_binario.sh "${{ inputs.base }}"
      - name: DEBUG=1
        run: . herramientas/entorno.sh && sh herramientas/comparar_binario.sh "${{ inputs.base }}" DEBUG=1

  publicar:
    name: Commit de publicación (build/ y compilaciones/)
    if: github.event_name == 'workflow_dispatch' && (inputs.publicar == 'si' || inputs.publicar == 'sí')
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev@sha256:7327334ab94e273b1723761fcd4a3591a31b78bbc28e4c281ad0fa42b3c8264d
    permissions:
      contents: write
    steps:
      - name: Dependencias del PC
        run: apk add --no-cache bash build-base python3 git coreutils findutils cdrkit
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      # Con make 4.3 se borran los intermedios de la ROM y quedarían como borrados
      - name: make 4.4 o posterior
        run: make --version | head -1 && make --version | head -1 | awk '{split($3,v,"."); exit !(v[1]>4 || (v[1]==4 && v[2]>=4))}'
      - name: Compilar todas las variantes versionadas
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . herramientas/entorno.sh
          make clean
          make -j"$(nproc)"
          make DEBUG=1 -j"$(nproc)"
          make DEV=1 -j"$(nproc)"
          make test
          make iso
      - name: Commit de publicación
        run: |
          git config user.name "Alexis Barrera"
          git config user.email "mochobarrera12@gmail.com"
          git add -A build/ps2 compilaciones
          # Solo se omite el commit si no hay nada preparado; cualquier otro fallo detiene el job
          if git diff --cached --quiet; then
            echo "sin cambios en build/ps2 ni en compilaciones: no hace falta commit de publicación"
            exit 0
          fi
          git commit -m "build(compilaciones): binarios e ISO en español" \
            -m "Regenerados desde cero con la imagen de ps2dev: release, DEBUG, DEV, pruebas e ISO." \
            -m "Compilado desde ${{ github.sha }} en la ejecución ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin HEAD:${{ github.ref_name }}

  release:
    name: Release con la ISO y el ELF monolítico
    if: github.event_name == 'workflow_dispatch' && inputs.release != ''
    runs-on: ubuntu-latest
    # La misma imagen que compilar-ps2: el ELF monolítico sale del mismo toolchain que la ISO
    container: ps2dev/ps2dev@sha256:7327334ab94e273b1723761fcd4a3591a31b78bbc28e4c281ad0fa42b3c8264d
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ETIQUETA: ${{ inputs.release }}
      ISO: compilaciones/SLUS_999.99.SuperMarioKart64.iso
      ELF_MONOLITICO: SLUS_999.99.monolitico.elf
    steps:
      - name: Dependencias del PC
        run: apk add --no-cache bash build-base python3 git coreutils findutils cdrkit github-cli
      - uses: actions/checkout@v4
      # La ISO publicada es la versionada, y su suma tiene que ser la que dicen las notas
      - name: Comprobar la ISO versionada con sus notas
        run: |
          NOTAS="docs/versiones/$ETIQUETA.md"
          test -f "$ISO" || { echo "falta $ISO"; exit 1; }
          test -f "$NOTAS" || { echo "faltan las notas $NOTAS"; exit 1; }
          SUMA=$(sha256sum "$ISO" | cut -d ' ' -f 1)
          grep -q "$SUMA" "$NOTAS" || { echo "el SHA-256 de la ISO ($SUMA) no está en $NOTAS"; exit 1; }
          sha256sum "$ISO" | sed 's#compilaciones/##' > SHA256SUMS
      # build/ está versionado: sin make clean el ELF podría salir de objetos del repo
      - name: make MONOLITICO=1
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . herramientas/entorno.sh
          make clean
          make MONOLITICO=1 -j"$(nproc)"
          cp build/ps2/monolitico/SLUS_999.99 "$ELF_MONOLITICO"
          sha256sum "$ELF_MONOLITICO" >> SHA256SUMS
          cat SHA256SUMS
      - name: Publicar la ISO y el ELF monolítico con sus notas
        run: |
          gh release create "$ETIQUETA" "$ISO" "$ELF_MONOLITICO" SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Mario Kart 64 PS2 en español $ETIQUETA" \
            --notes-file "docs/versiones/$ETIQUETA.md"

  limpiar-ramas:
    name: Borrar las ramas ya contenidas en main
    if: github.event_name == 'workflow_dispatch' && (inputs.limpiar_ramas == 'si' || inputs.limpiar_ramas == 'sí')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Solo se borra una rama si su punta ya está en main: no se pierde ningún commit
      - name: Borrar
        run: |
          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | while read -r rama; do
            case "$rama" in main|HEAD) continue ;; esac
            if git merge-base --is-ancestor "origin/$rama" origin/main; then
              git push origin --delete "$rama"
            else
              echo "se conserva $rama: tiene commits que no están en main"
            fi
          done
